apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cache
spec:
  providerRef:
    name: example
  version: "1.6.38"
  topology:
    type: pool
  components:
    engine:
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
      parameters:
        maxConnections: 2048
        threads: 4
