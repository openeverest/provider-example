# The new node joins and the Instance settles back on Ready.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
spec:
  replicas: 3
status:
  readyReplicas: 3
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cache
status:
  phase: Provisioned
  (conditions[?type == 'Ready'].status | [0]): "True"
  # The desired count describes the generation the status was written for,
  # so 3 shows that Ready is about the scaled-out spec, not left over from
  # before it.
  (components[?name == 'engine'] | [0].desiredReplicas): 3
  (components[?name == 'engine'] | [0].readyReplicas): 3
