---
# Lifecycle of an Instance, end to end.
#
# Unlike an operator-backed provider, nothing here is simulated: memcached
# really starts, the readiness probe really passes, and the Instance really
# reaches Ready. That is the upside of a provider that owns its workload.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core
spec:
  description: |
    Create an Instance, wait for it to become Ready, scale the pool out, then
    delete it and check the workload is garbage collected.

  # Collect diagnostics when a step fails.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance -o yaml
    - script:
        content: kubectl -n $NAMESPACE get statefulset,service,pod -o wide
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-example
        tail: 100

  steps:
    - name: provider-deployed
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-instance
      description: The provider translates the Instance into a StatefulSet and a headless Service.
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml

    - name: instance-ready
      description: Once every node passes its readiness probe the Instance reports Ready.
      try:
        - assert:
            timeout: 180s
            file: 11-assert.yaml

    - name: scale-out
      description: Adding nodes takes the Instance through Updating and back to Ready.
      try:
        - apply:
            file: 20-scale-out.yaml
        - assert:
            timeout: 180s
            file: 20-assert.yaml

    - name: delete-instance
      description: Owner references garbage collect the workload, which is why Cleanup can be a no-op.
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: cache
        - script:
            content: |
              kubectl -n $NAMESPACE wait --for=delete statefulset/cache --timeout=120s
              kubectl -n $NAMESPACE wait --for=delete service/cache --timeout=120s
