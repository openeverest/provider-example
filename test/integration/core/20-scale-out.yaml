# Scaling the pool out: the only change is the node count.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cache
spec:
  providerRef:
    name: example
  version: "1.6.38"
  topology:
    type: pool
  components:
    engine:
      replicas: 3
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
      parameters:
        maxConnections: 2048
        threads: 2
