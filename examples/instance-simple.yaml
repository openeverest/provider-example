# The smallest Instance this provider accepts: a single memcached node.
#
# Everything else is defaulted — the version comes from the default bundle in
# definition/versions.yaml, and the topology from the only one on offer.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: cache
spec:
  providerRef:
    name: example
  components:
    engine: {}
