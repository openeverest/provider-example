# Provider identity and component definitions.
#
# `name` is the name of the Provider CR this repository ships. Instances select
# it through `spec.providerRef.name`, and the provider binary uses it to look
# its own Provider CR up at runtime — so it must match common.ProviderName in
# internal/common/spec.go.
#
# Components are logical *roles* ("engine", "proxy", "configServer").
# Component *types* are the software a role runs ("memcached"). Several
# components may share one type; this provider has a single component.

name: example

components:
  engine:
    type: memcached
    # Provider-specific fields this component accepts on top of the ones every
    # component has (version, image, replicas, resources, storage). Resolved
    # into an OpenAPI schema at generate time from the Go type of the same name
    # in definition/components/types.go.
    parametersSchema: MemcachedParameters
